<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mini-RAG</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >
</head>

<body>

<div class="app-container">

    <!-- ========================= -->
    <!-- 左侧栏 -->
    <!-- ========================= -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div class="logo">

                <span class="logo-icon">
                    📚
                </span>

                <span class="logo-text">
                    Mini-RAG
                </span>

            </div>


            <button
                id="btn-new-session"
                class="new-chat-btn"
            >
                ＋ 新会话
            </button>

        </div>


        <!-- ========================= -->
        <!-- 会话列表 -->
        <!-- ========================= -->

        <div
            id="session-list"
            class="session-list"
        >

            <!--
            JS 后面会动态生成会话列表
            -->

        </div>


        <!-- ========================= -->
        <!-- 知识库 -->
        <!-- ========================= -->

        <div class="knowledge-section">

            <div class="knowledge-title">

                <span class="knowledge-icon">
                    📄
                </span>

                <span>
                    知识库
                </span>

            </div>


            <label for="file-input" class="upload-btn">
    上传文档
</label>

<input type="file" id="file-input">

<div id="upload-status"></div>

<ul id="doc_list"></ul>

        </div>

    </aside>



    <!-- ========================= -->
    <!-- 右侧聊天区域 -->
    <!-- ========================= -->

    <main class="main-content">


        <!-- ========================= -->
        <!-- 当前会话标题 -->
        <!-- ========================= -->

        <header class="chat-header">

            <h2 id="current-session-title">
                选择一个会话
            </h2>

        </header>


        <!-- ========================= -->
        <!-- 消息区域 -->
        <!-- ========================= -->

        <section
            id="messages"
            class="chat-messages"
        >

            <!--
            后面 JS 动态插入：

            <div class="message user-message">
                <div class="message-content">
                    用户问题
                </div>
            </div>

            -->

        </section>


        <!-- ========================= -->
        <!-- 输入框 -->
        <!-- ========================= -->

        <footer class="chat-input-area">

            <div class="input-wrapper">


                <textarea
                    id="user-input"
                    placeholder="输入问题..."
                    rows="1"
                ></textarea>


                <button
                    id="btn-send"
                    class="send-btn"
                >
                    发送
                </button>


            </div>

        </footer>

    </main>

</div>


<!-- 引入 JS -->
<script src="/js/app.js"></script>

</body>

</html>
